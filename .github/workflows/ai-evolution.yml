name: AI evolution (weekly)

# One generation of Loki's self-evolution (see evolve.py and loki_v8/evolution.py):
# the live AI is re-tested against challenger versions of itself on fresh data,
# its learn-from-mistakes filter is retrained on every closed trade, and the
# result is proposed as a pull request. Merging the PR deploys it; closing it
# keeps the current AI. Nothing reaches the live site without that review.

on:
  schedule:
    - cron: '23 5 * * 0'   # Sundays 05:23 UTC, after the weekly close
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-evolution
  cancel-in-progress: false

jobs:
  evolve:
    name: Champion vs challengers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_test.txt

      - name: Run one generation
        run: python evolve.py --data-dir state/history --workers 4 --write-snapshot --summary evolution.md

      - name: Test the evolved AI before proposing it
        run: pytest tests/ -q -o addopts="" -p no:cacheprovider
        env:
          PYTHONPATH: .

      - name: Propose the update as a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat evolution.md >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- loki_v8/training_report_snapshot.json loki_v8/evolution_log.json; then
            echo "Nothing changed this week."
            exit 0
          fi
          gen=$(python -c "import json; print(json.load(open('loki_v8/evolution_log.json'))['generations'][-1]['generation'])")
          branch="ai-evolution/generation-${gen}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add loki_v8/training_report_snapshot.json loki_v8/evolution_log.json
          git commit -m "AI evolution: generation ${gen}" -m "Champion-vs-challenger results and retrained mistake filter. See the PR description."
          git push --force origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file evolution.md
          elif ! gh pr create --base main --head "$branch" --title "AI evolution: generation ${gen}" --body-file evolution.md; then
            echo "::warning::The update is on branch ${branch}, but a pull request could not be opened. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General, or open it by hand."
          fi
